<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Seu Carrinho · Cor Indivisum</title>
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="carrinho.css">
</head>
<body>

  <header class="loja-header">
    <div class="loja-header-inner">
      <a href="/loja" class="btn-voltar">&larr; Continuar Comprando</a>
      <span class="brand-logo">COR INDIVISUM</span>
    </div>
  </header>

  <main class="carrinho-pagina-container">
    <h2>Seu Carrinho de Compras</h2>

    <div class="carrinho-grid">
      <div class="carrinho-tabela-wrap">
        <table class="carrinho-tabela">
          <thead>
            <tr>
              <th>Produto</th>
              <th>Preço</th>
              <th>Quantidade</th>
              <th>Total</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="carrinho-tbody">
            <!-- Itens preenchidos via JS -->
          </tbody>
        </table>
        <div id="carrinho-vazio-msg" hidden>
          <p>Seu carrinho está vazio.</p>
          <a href="/loja" class="btn-primary">Ver Produtos</a>
        </div>
      </div>

      <aside class="carrinho-resumo-card">
        <h3>Resumo do Pedido</h3>
        <div class="resumo-linha">
          <span>Subtotal</span>
          <strong id="carrinho-subtotal">R$ 0,00</strong>
        </div>
        <p class="frete-aviso">* O frete será calculado na tela de checkout.</p>
        
        <a href="/loja/checkout" class="btn-primary btn-block text-center" id="btn-ir-checkout">
          Prosseguir para o Checkout
        </a>
      </aside>
    </div>
  </main>

  <script src="carrinho.js"></script>
</body>
</html>
