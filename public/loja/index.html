<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Meta Tags Principais de SEO -->
    <title>Loja · Cor Indivisum Editora</title>
    <meta name="description" content="Adquira os livros e publicações oficiais da Cor Indivisum Editora. Obras com conselho editorial capacitado e acerto teológico, filosófico e literário.">
    <meta name="keywords" content="loja católica, livros de teologia, pré-venda de livros católicos, Cor Indivisum loja">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://corindivisum.com.br/loja/">

    <!-- Open Graph / WhatsApp -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://corindivisum.com.br/loja/">
    <meta property="og:title" content="Loja Oficial · Cor Indivisum Editora">
    <meta property="og:description" content="Confira o catálogo de lançamentos e pré-vendas de livros da Cor Indivisum Editora.">
    <meta property="og:image" content="https://corindivisum.com.br/src/images/Fundo.webp">
    <meta property="og:site_name" content="Cor Indivisum">
    <meta property="og:locale" content="pt_BR">

    <!-- Preconnect & Fontes -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="dns-prefetch" href="https://www.gstatic.com">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="/styles.css">
    <link rel="stylesheet" href="/loja/loja.css">
    <link rel="icon" href="/favicon.png" type="image/png">
    <link rel="shortcut icon" href="/favicon.ico">

    <!-- Firebase Scripts -->
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-functions-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="/src/scripts/firebase-init.js" defer></script>
</head>
<body>

<!-- TOPO COM BOTÃO QUE ABRE O MODAL -->

<header class="loja-header">
  <div class="loja-header-inner">
    <a href="/" class="brand-logo">COR INDIVISUM</a>
    <nav class="nav-links" id="nav-links">
			<a href="/">Home</a>
			<a href="/loja">Loja</a>
			<a href="/minha-conta">Minha Conta</a>
		</nav>

    <div class="header-actions">
      <div class="header-right">
			<nav class="nav-links-desktop" id="nav-links-desktop">

			<a href="/">Home</a>
				<a href="/loja">Loja</a>
				<a href="/minha-conta">Minha Conta</a>
			</nav>
      <button type="button" class="btn-carrinho-topo" id="btn-abrir-carrinho">
        <img src="/src/images/icons/cart.svg" alt="Carrinho"> Carrinho (<span id="cart-count">0</span>)
      </button>
    </div>
  </div>
</header>

<!-- MODAL DRAWER DO CARRINHO (Aparece ao clicar no carrinho) -->
<div class="carrinho-modal-overlay" id="carrinho-modal" hidden>
  <div class="carrinho-modal-content" role="dialog" aria-modal="true" aria-labelledby="carrinho-modal-titulo">
    <div class="carrinho-modal-header">
      <h3 id="carrinho-modal-titulo">Seu Carrinho</h3>
      <button type="button" class="btn-fechar-modal" id="btn-fechar-carrinho" aria-label="Fechar carrinho">&times;</button>
    </div>

    <div class="carrinho-modal-body" id="modal-carrinho-itens">
      <!-- Os itens do carrinho renderizam aqui via JS -->
    </div>

    <div class="carrinho-modal-footer">
      <div class="subtotal-wrap">
        <span>Subtotal:</span>
        <strong id="modal-carrinho-subtotal">R$ 0,00</strong>
      </div>
      <div class="modal-acoes-duplas">
        <a href="/loja/carrinho" class="btn-secundario text-center">Ver Carrinho Completo</a>
        <a href="/loja/checkout" class="btn-primary text-center">Finalizar Compra</a>
      </div>
    </div>
  </div>
</div>

  <main class="loja-container">

    <!-- BARRA DE FILTROS E BUSCA -->
    <section class="loja-controles">
      <div class="busca-wrap">
        <input type="text" id="input-busca" placeholder="Buscar produtos...">
      </div>

      <div class="filtro-wrap">
        <select id="select-categoria">
          <option value="">Todas as Categorias</option>
        </select>
      </div>
    </section>

    <!-- GRID DE PRODUTOS -->
    <section class="produtos-grid" id="produtos-container">
      <p class="loading-state">Carregando catálogo...</p>
    </section>

  </main>

  <div class="descricao-produto-modal" id="descricao-produto-modal" hidden>
    <section class="descricao-produto-painel" role="dialog" aria-modal="true" aria-labelledby="descricao-produto-titulo">
      <header class="descricao-produto-cabecalho">
        <button type="button" class="descricao-produto-voltar" id="descricao-produto-voltar">← Voltar à loja</button>
        <span>Descrição completa</span>
      </header>
      <article class="descricao-produto-leitura">
        <h2 id="descricao-produto-titulo"></h2>
        <div class="descricao-produto-conteudo" id="descricao-produto-conteudo"></div>
      </article>
      <footer class="descricao-produto-rodape">
        <a class="descricao-produto-link" id="descricao-produto-link" href="#">Ver página do produto</a>
      </footer>
    </section>
  </div>

  <footer>
    <div class="cross">✝</div>
    <p class="fine">COR INDIVISUM &middot; Iniciativa católica leiga &middot; Produção audiovisual &amp; editora</p>
  </footer>
  <script src="/src/scripts/checkout-utils.js"></script>
  <script src="loja.js"></script>
</body>
</html>
