<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<title>Teste - Integração Melhor Envio</title>
<style>
  :root {
    --bg: #0f172a;
    --card: #1e293b;
    --border: #334155;
    --text: #e2e8f0;
    --muted: #94a3b8;
    --accent: #22c55e;
    --error: #f87171;
    --warn: #fbbf24;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 24px;
  }
  h1 { font-size: 20px; margin-bottom: 4px; }
  .subtitle { color: var(--muted); font-size: 13px; margin-bottom: 20px; }
  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    align-items: start;
  }
  @media (max-width: 900px) {
    .grid { grid-template-columns: 1fr; }
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
    margin-bottom: 16px;
  }
  .card h2 {
    font-size: 15px;
    margin: 0 0 12px 0;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  label {
    display: block;
    font-size: 12px;
    color: var(--muted);
    margin: 8px 0 4px;
  }
  input {
    width: 100%;
    padding: 8px 10px;
    background: #0f172a;
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font-size: 13px;
  }
  .row { display: flex; gap: 8px; }
  .row > div { flex: 1; }
  button {
    background: #334155;
    color: var(--text);
    border: 1px solid var(--border);
    padding: 9px 14px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
    margin-top: 10px;
    margin-right: 6px;
  }
  button.primary { background: #16a34a; border-color: #16a34a; }
  button.secondary { background: #2563eb; border-color: #2563eb; }
  button:hover { filter: brightness(1.15); }
  .status-badge {
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 999px;
    border: 1px solid var(--border);
  }
  .status-ok { color: var(--accent); border-color: var(--accent); }
  .status-bad { color: var(--error); border-color: var(--error); }
  .status-unknown { color: var(--muted); }
  #log {
    background: #020617;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px;
    height: 480px;
    overflow-y: auto;
    font-family: "SF Mono", Consolas, monospace;
    font-size: 12px;
    line-height: 1.5;
  }
  .log-line { white-space: pre-wrap; word-break: break-word; margin-bottom: 6px; padding-bottom: 6px; border-bottom: 1px dashed #1e293b; }
  .log-time { color: var(--muted); }
  .log-info { color: #93c5fd; }
  .log-ok { color: var(--accent); }
  .log-err { color: var(--error); }
  .log-req { color: var(--warn); }
  .toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .opcoes-frete { margin-top: 10px; }
  .opcao {
    background: #0f172a;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px;
    margin-bottom: 8px;
    font-size: 13px;
  }
  .opcao b { color: var(--accent); }
  .opcao .erro { color: var(--error); }
  code { color: #fbbf24; }
</style>
</head>
<body>

<h1>Teste — Integração Melhor Envio</h1>
<p class="subtitle">Página isolada, só para testar os endpoints do Cloud Functions. Não interfere no checkout/webhook.</p>

<div class="grid">
  <div>

    <div class="card">
      <h2>0. Configuração</h2>
      <label>Base URL das Cloud Functions</label>
      <input id="baseUrl" placeholder="https://southamerica-east1-SEUPROJETO.cloudfunctions.net" />
      <button class="secondary" onclick="salvarConfig()">Salvar</button>
    </div>

    <div class="card">
      <h2>1. Autenticação <span id="statusBadge" class="status-badge status-unknown">desconhecido</span></h2>
      <button class="primary" onclick="iniciarAuth()">Iniciar autenticação (abre nova aba)</button>
      <button onclick="checarStatus()">Checar status</button>
    </div>

    <div class="card">
      <h2>2. Calcular Frete</h2>
      <div class="row">
        <div>
          <label>CEP origem</label>
          <input id="cepOrigem" value="01310-100" />
        </div>
        <div>
          <label>CEP destino</label>
          <input id="cepDestino" value="20040-020" />
        </div>
      </div>
      <div class="row">
        <div>
          <label>Peso (kg)</label>
          <input id="peso" type="number" step="0.1" value="0.5" />
        </div>
        <div>
          <label>Valor (R$)</label>
          <input id="valor" type="number" step="0.01" value="64.90" />
        </div>
      </div>
      <div class="row">
        <div>
          <label>Altura (cm)</label>
          <input id="altura" type="number" value="4" />
        </div>
        <div>
          <label>Largura (cm)</label>
          <input id="largura" type="number" value="16" />
        </div>
        <div>
          <label>Comprimento (cm)</label>
          <input id="comprimento" type="number" value="23" />
        </div>
      </div>
      <button class="primary" onclick="calcularFrete()">Calcular frete</button>

      <div id="opcoesFrete" class="opcoes-frete"></div>
    </div>

  </div>

  <div>
    <div class="card">
      <div class="toolbar">
        <h2 style="margin:0">Log completo</h2>
        <div>
          <button onclick="limparLog()">Limpar</button>
        </div>
      </div>
      <div id="log"></div>
    </div>
  </div>
</div>

<script>
let BASE_URL = localStorage.getItem("me_base_url") || "";
document.getElementById("baseUrl").value = BASE_URL;

function salvarConfig() {
  BASE_URL = document.getElementById("baseUrl").value.trim().replace(/\/$/, "");
  localStorage.setItem("me_base_url", BASE_URL);
  log("info", "Config salva. Base URL = " + BASE_URL);
}

function agora() {
  return new Date().toLocaleTimeString("pt-BR", { hour12: false }) + "." +
    String(new Date().getMilliseconds()).padStart(3, "0");
}

function log(tipo, msg) {
  const el = document.getElementById("log");
  const div = document.createElement("div");
  div.className = "log-line";
  const classe = { info: "log-info", ok: "log-ok", err: "log-err", req: "log-req" }[tipo] || "";
  div.innerHTML = '<span class="log-time">[' + agora() + ']</span> <span class="' + classe + '">' + msg + "</span>";
  el.appendChild(div);
  el.scrollTop = el.scrollHeight;
}

function limparLog() {
  document.getElementById("log").innerHTML = "";
}

function checarBaseUrl() {
  if (!BASE_URL) {
    log("err", "Configure a Base URL das Cloud Functions primeiro (passo 0).");
    return false;
  }
  return true;
}

async function chamar(nome, url, options) {
  log("req", "→ " + (options?.method || "GET") + " " + url +
    (options?.body ? "\nBody: " + options.body : ""));
  try {
    const res = await fetch(url, options);
    const texto = await res.text();
    let corpo;
    try { corpo = JSON.parse(texto); } catch { corpo = texto; }

    if (res.ok) {
      log("ok", "← [" + res.status + "] " + nome + "\n" + JSON.stringify(corpo, null, 2));
    } else {
      log("err", "← [" + res.status + "] " + nome + " (erro)\n" + JSON.stringify(corpo, null, 2));
    }
    return { ok: res.ok, status: res.status, corpo };
  } catch (err) {
    log("err", "✗ Falha de rede em " + nome + ": " + err.message);
    return { ok: false, status: 0, corpo: null, erroRede: err.message };
  }
}

function iniciarAuth() {
  if (!checarBaseUrl()) return;
  const url = BASE_URL + "/melhorEnvioAuthStart?state=teste_" + Date.now();
  log("info", "Abrindo autenticação em nova aba: " + url);
  window.open(url, "_blank");
}

async function checarStatus() {
  if (!checarBaseUrl()) return;
  const r = await chamar("melhorEnvioStatus", BASE_URL + "/melhorEnvioStatus");
  const badge = document.getElementById("statusBadge");
  if (r.ok && r.corpo?.autenticado) {
    const expirado = r.corpo.expirado;
    badge.textContent = expirado ? "token expirado" : "autenticado";
    badge.className = "status-badge " + (expirado ? "status-bad" : "status-ok");
  } else if (r.ok) {
    badge.textContent = "não autenticado";
    badge.className = "status-badge status-bad";
  } else {
    badge.textContent = "erro ao checar";
    badge.className = "status-badge status-bad";
  }
}

async function calcularFrete() {
  if (!checarBaseUrl()) return;

  const payload = {
    cepOrigem: document.getElementById("cepOrigem").value,
    cepDestino: document.getElementById("cepDestino").value,
    produtos: [
      {
        id: "produto-1",
        peso: parseFloat(document.getElementById("peso").value),
        altura: parseFloat(document.getElementById("altura").value),
        largura: parseFloat(document.getElementById("largura").value),
        comprimento: parseFloat(document.getElementById("comprimento").value),
        valor: parseFloat(document.getElementById("valor").value),
        quantidade: 1,
      },
    ],
  };

  const r = await chamar("melhorEnvioCalcularFrete", BASE_URL + "/melhorEnvioCalcularFrete", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(payload),
  });

  const container = document.getElementById("opcoesFrete");
  container.innerHTML = "";

  if (!r.ok) {
    container.innerHTML = '<div class="opcao erro">Falha ao calcular frete. Veja o log.</div>';
    return;
  }

  const opcoes = r.corpo?.opcoes || [];
  if (!Array.isArray(opcoes) || opcoes.length === 0) {
    container.innerHTML = '<div class="opcao">Nenhuma opção retornada.</div>';
    return;
  }

  opcoes.forEach((op) => {
    const div = document.createElement("div");
    div.className = "opcao";
    if (op.error) {
      div.innerHTML = "<b>" + (op.name || op.company?.name || "?") + "</b> — <span class='erro'>" + op.error + "</span>";
    } else {
      div.innerHTML =
        "<b>" + (op.company?.name || op.name) + "</b> (" + op.name + ")<br/>" +
        "Preço: R$ " + op.price + " — Prazo: " + op.delivery_time + " dia(s)";
    }
    container.appendChild(div);
  });
}

log("info", "Página carregada. Configure a Base URL e comece pelo passo 1.");
</script>

</body>
</html>
